# ══════════════════════════════════════════════════════════════
#  AX Playground 내부망 가드레일 — GR2-3 모델 정보 유출 방지 (M16)
#  Nginx 보안 헤더/응답 정제 설정.
#
#  적용: 기존 server 블록(443 TLS) 안에 include 하거나 내용을 병합.
#    include /etc/nginx/conf.d/ax-security.conf;
#  적용 후: nginx -t && systemctl reload nginx
# ══════════════════════════════════════════════════════════════

# ── 서버/프록시 식별 정보 숨김 ────────────────────────────────
server_tokens off;                         # Nginx 버전 노출 제거
proxy_hide_header X-Powered-By;            # Next.js "X-Powered-By: Next.js" 제거
proxy_hide_header X-Ollama-Version;        # (있을 경우) 모델 서버 버전 헤더 제거
proxy_hide_header Server;                   # 업스트림 Server 헤더 제거

# ── 보안 응답 헤더 ────────────────────────────────────────────
add_header X-Content-Type-Options    "nosniff"            always;
add_header X-Frame-Options           "SAMEORIGIN"         always;
add_header Referrer-Policy           "no-referrer"        always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-XSS-Protection          "1; mode=block"      always;

# ── 내부 LLM 엔드포인트 외부 직접 노출 차단 ───────────────────
# Ollama(:11434)·Qdrant(:6333)·Mongo(:27017)는 루프백 전용이어야 하며
# 외부에서 프록시로도 도달하지 못하게 한다. (직접 location 프록시 금지)
location ~ ^/(api/ollama|v1/models|api/tags) {
    deny all;
    return 404;
}

# 참고: 실제 사용자 트래픽은 Next.js(:3000)만 프록시한다.
#   location / { proxy_pass http://127.0.0.1:3000; ... }
